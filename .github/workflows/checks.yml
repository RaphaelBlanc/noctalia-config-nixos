name: NixOS
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "23 5 * * 1"
permissions:
  contents: read
concurrency:
  group: nixos-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: cachix/install-nix-action@d9186cbdca7adedf113a159fa91f725a27866771 # v31
        with:
          extra_nix_config: |
            system-features = nixos-test benchmark big-parallel kvm
      - name: Libérer l’espace nécessaire aux disques de test
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
      - name: Actualiser l'amont pour la vérification hebdomadaire
        if: github.event_name == 'schedule'
        run: nix flake update upstream
      - name: Évaluer x86_64 et aarch64
        run: nix flake check --no-build --all-systems
      - name: Construire les adaptations et vérifier les privilèges
        run: nix flake check -L --cores 2 --max-jobs 2
      - name: Préparer KVM
        run: |
          test -c /dev/kvm
          sudo chmod 0666 /dev/kvm
      - name: Bureau, assistants root et démarrage réel
        run: |
          set -o pipefail
          nix build .#vm-test .#boot-test -L --cores 2 --max-jobs 1 --out-link result-validation 2>&1 | tee vm-tests.log
      - name: Préparer le résultat de la mise à jour amont
        if: github.event_name == 'schedule'
        run: git diff -- flake.lock > upstream-lock.patch
      - name: Conserver les journaux et captures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: validation-nixos
          path: |
            result-validation/
            result-validation-1/
            upstream-lock.patch
            vm-tests.log
          if-no-files-found: ignore
